<app-page>

  <app-page-header>

    <div>
      <h1 class="text-3xl font-bold text-slate-900">
        Dashboard
      </h1>

      <p class="mt-1 text-sm text-slate-500">
        Bem-vindo ao Stock Control
      </p>
    </div>

  </app-page-header>

  <app-page-content>

    <div class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-4">

      <app-stat-card
        title="Produtos"
        [value]="0">
      </app-stat-card>

      <app-stat-card
        title="Categorias"
        [value]="0">
      </app-stat-card>

      <app-stat-card
        title="Fornecedores"
        [value]="0">
      </app-stat-card>

      <app-stat-card
        title="Estoque baixo"
        [value]="0">
      </app-stat-card>

    </div>

    <app-card>

      <app-card-header>

        Últimas movimentações

      </app-card-header>

      <app-card-content>

        <app-empty-state>

          Nenhuma movimentação encontrada.

        </app-empty-state>

      </app-card-content>

    </app-card>

  </app-page-content>

</app-page>
