<app-page>
  <app-page-header>
    <div>
      <h1 class="text-3xl font-bold">Produtos</h1>

      <p class="text-slate-500">Gerencie os produtos do estoque.</p>
    </div>

    <app-button (click)="newProduct()"> Novo Produto </app-button>
  </app-page-header>

  <app-page-content>
    <app-card>
      <app-card-header> Produtos cadastrados </app-card-header>

      <app-card-content>
        @if (store.loading()) {
        <div class="flex items-center justify-center py-12">
          <p class="text-slate-500">Carregando produtos...</p>
        </div>
        } @else if (store.hasProducts()) {
        <app-product-list [products]="store.products()" />
        } @else {
        <app-empty-state></app-empty-state>
        }
      </app-card-content>
    </app-card>
  </app-page-content>
</app-page>
