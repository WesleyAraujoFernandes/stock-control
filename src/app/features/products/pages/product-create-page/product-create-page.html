<app-page>
  <app-page-header>
    <div>
      <h1 class="text-3xl font-bold">
        Novo Produto
      </h1>
      <p class="text-slate-500">
        Cadastre um novo produto no estoque.
      </p>
    </div>
  </app-page-header>
  <app-page-content>
    <app-product-form (saved)="onProductSaved($event)" (saveError)="onSaveError($event)" (cancelled)="onCancelled()" />
  </app-page-content>
</app-page>
